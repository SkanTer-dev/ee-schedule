<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EE Broadcast Hub — Календарь Кастера</title>
<style>
  :root {
    --bg: #09090b;
    --card: #141418;
    --card-hover: #1c1c22;
    --brd: #27272a;
    --txt: #fafafa;
    --mut: #a1a1aa;
    --red: #e11d48;
    --red-dim: rgba(225, 29, 72, 0.15);
    --yes: #10b981;
    --no: #ef4444;
    --pend: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--txt);
    margin: 0;
    padding: 20px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* Header */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    background: var(--card);
    padding: 14px 20px;
    border-radius: 12px;
    border: 1px solid var(--brd);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo {
    width: 46px;
    height: 46px;
    border-radius: 10px;
    background: #0a0a0c;
    border: 1px solid var(--brd);
    object-fit: contain;
    padding: 3px;
  }
  .brand h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.5px; text-transform: uppercase; }
  .brand p { margin: 2px 0 0; font-size: 0.8rem; color: var(--mut); }

  .sync-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(16, 185, 129, 0.12);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.25);
    margin-top: 4px;
  }
  .sync-badge.err { background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.25); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .tabs {
    background: #0a0a0c;
    padding: 5px;
    border-radius: 9px;
    display: flex;
    gap: 6px;
    border: 1px solid var(--brd);
  }
  .tab {
    background: transparent;
    border: none;
    color: var(--mut);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: 0.15s;
  }
  .tab img { width: 20px; height: 20px; border-radius: 4px; background: #0a0a0c; }
  .tab:hover { color: #fff; }
  .tab.act { background: var(--red); color: #fff; }

  /* Form */
  .form {
    background: var(--card);
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--brd);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
  }
  input, select, button {
    padding: 10px 12px;
    border-radius: 7px;
    border: 1px solid var(--brd);
    background: #0a0a0c;
    color: #fff;
    font-size: 0.9rem;
  }
  input:focus, select:focus { outline: none; border-color: var(--red); }
  .btn-add {
    background: var(--red);
    border: none;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    transition: 0.15s;
  }
  .btn-add:hover { background: #be123c; }

  /* Calendar Grid */
  .cal-box {
    background: var(--card);
    padding: 18px;
    border-radius: 12px;
    border: 1px solid var(--brd);
  }
  .cal-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .m-lbl { font-size: 1.25rem; font-weight: 700; text-transform: capitalize; }
  .nav-btns { display: flex; gap: 6px; }
  .nav-btns button { cursor: pointer; font-weight: 600; }
  .nav-btns button:hover { border-color: var(--red); }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--brd);
    border: 1px solid var(--brd);
    border-radius: 8px;
    overflow: hidden;
  }
  .wday {
    background: #101014;
    padding: 8px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--mut);
    font-weight: 700;
    text-transform: uppercase;
  }
  .cell {
    background: #0d0d10;
    min-height: 105px;
    padding: 6px;
    cursor: pointer;
    transition: 0.15s;
  }
  .cell:hover { background: #16161c; }
  .cell.dim { opacity: 0.3; cursor: default; }
  .cell.sel { outline: 2px solid var(--red); outline-offset: -2px; }
  .c-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .num {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 700;
  }
  .today .num { background: var(--red); color: #fff; }

  .pill {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    padding: 3px 5px;
    border-radius: 4px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-left: 3px solid var(--pend);
    background: var(--card);
  }
  .pill img { width: 15px; height: 15px; border-radius: 3px; flex-shrink: 0; background: #0a0a0c; }
  .pill span { overflow: hidden; text-overflow: ellipsis; }
  .pill.yes { border-left-color: var(--yes); }
  .pill.no { border-left-color: var(--no); }

  /* Match List */
  .list-head { display: flex; justify-content: space-between; align-items: center; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .m-card {
    background: var(--card);
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid var(--brd);
    border-left: 5px solid var(--pend);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .m-card.yes { border-left-color: var(--yes); }
  .m-card.no { border-left-color: var(--no); }

  .m-left { display: flex; align-items: center; gap: 14px; }
  .m-logo {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: #0a0a0c;
    border: 1px solid var(--brd);
    padding: 3px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .b-main { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  .b-acad { background: var(--red-dim); color: #fda4af; border: 1px solid rgba(225,29,72,0.35); }

  .m-title { margin: 5px 0; font-size: 1.05rem; font-weight: 700; }
  .m-meta { color: var(--mut); font-size: 0.85rem; display: flex; gap: 14px; flex-wrap: wrap; }
  .m-meta a { color: #fb7185; text-decoration: none; font-weight: 600; }
  .m-meta a:hover { text-decoration: underline; }

  .ctrls { display: flex; gap: 6px; align-items: center; }
  .st-btn {
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.82rem;
    opacity: 0.4;
    transition: 0.15s;
  }
  .st-btn:hover { opacity: 0.8; }
  .st-btn.act { opacity: 1; }
  .s-y { background: var(--yes); color: #052e16; }
  .s-p { background: var(--pend); color: #451a03; }
  .s-n { background: var(--no); color: #fff; }
  .del {
    background: transparent;
    border: none;
    color: var(--mut);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px 8px;
  }
  .del:hover { color: var(--no); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <img class="brand-logo" id="headerLogo" alt="EE">
      <div>
        <h1>EE Broadcast Hub</h1>
        <p>Расписание эфиров • Основной и Академический составы</p>
        <div class="sync-badge" id="syncStatus"><span class="dot"></span><span>Синхронизация с облаком...</span></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab act" onclick="setRos('ALL', this)">Все составы</button>
      <button class="tab" onclick="setRos('MAIN', this)"><img id="tabMainLogo" alt=""> Основной</button>
      <button class="tab" onclick="setRos('ACAD', this)"><img id="tabAcadLogo" alt=""> Академия</button>
    </div>
  </div>

  <div class="form">
    <select id="fRos">
      <option value="MAIN">Основной состав (EE)</option>
      <option value="ACAD">Академический состав (EE Academy)</option>
    </select>
    <input type="datetime-local" id="fDt">
    <input type="text" id="fTitle" placeholder="Турнир / Соперник">
    <input type="url" id="fLink" placeholder="Ссылка (HLTV / Liquipedia)">
    <button class="btn-add" onclick="addMatch()">+ Добавить матч</button>
  </div>

  <div class="cal-box">
    <div class="cal-nav">
      <div class="m-lbl" id="mLbl"></div>
      <div class="nav-btns">
        <button onclick="move(-1)">▲ Пред.</button>
        <button onclick="cur=new Date();selDate=null;render()">Сегодня</button>
        <button onclick="move(1)">▼ След.</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="list-head">
    <b id="listTitle" style="font-size:1.05rem">Матчи выбранного месяца</b>
    <button id="resetBtn" style="display:none;font-size:0.8rem;cursor:pointer" onclick="selDate=null;render()">Показать весь месяц ✕</button>
  </div>
  <div class="list" id="list"></div>
</div>

BAQCAQEAgGBQEAgEBAIBAQCAYFAQCAQEAgEBAIBgUBAIBAQCAQEAgGBQEAgEBAIBAQCgX8BsNL19PV1/s8AAAAASUVORK5CYII=";

  document.getElementById('headerLogo').src = LOGO_MAIN;
  document.getElementById('tabMainLogo').src = LOGO_MAIN;
  document.getElementById('tabAcadLogo').src = LOGO_ACAD;

  const pad = n => String(n).padStart(2, '0');
  const dStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = dStr(new Date());

  let cur = new Date();
  let rosFilter = 'ALL';
  let selDate = null;
  let db = [];

  function setSyncUI(ok, text) {
    const el = document.getElementById('syncStatus');
    el.className = ok ? 'sync-badge' : 'sync-badge err';
    el.innerHTML = '<span class="dot"></span><span>' + text + '</span>';
  }

  async function loadFromCloud() {
    try {
      const res = await fetch(DB_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data && typeof data === 'object') {
        db = Object.keys(data).map(k => Object.assign({ fbKey: k }, data[k]));
      } else {
        db = [];
      }
      setSyncUI(true, 'Онлайн • Синхронизировано');
      render();
    } catch (err) {
      setSyncUI(false, 'Ошибка сети / доступа к базе');
      console.error(err);
    }
  }

  async function addMatch() {
    const dt = document.getElementById('fDt').value;
    const title = document.getElementById('fTitle').value.trim();
    const ros = document.getElementById('fRos').value;
    const link = document.getElementById('fLink').value.trim();

    if (!dt || !title) {
      alert('Укажите дату/время и название турнира');
      return;
    }

    const item = { id: Date.now(), ros: ros, dt: dt, title: title, link: link, st: 'pend' };
    document.getElementById('fTitle').value = '';
    document.getElementById('fLink').value = '';
    setSyncUI(true, 'Сохранение...');

    try {
      const res = await fetch(DB_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item)
      });
      if (!res.ok) throw new Error('Save failed');
      await loadFromCloud();
    } catch (e) {
      setSyncUI(false, 'Не удалось сохранить матч');
    }
  }

  async function setSt(fbKey, st) {
    const item = db.find(e => e.fbKey === fbKey);
    if (!item) return;
    item.st = st;
    render();
    setSyncUI(true, 'Обновление статуса...');
    try {
      const itemUrl = DB_URL.replace('/matches.json', '/matches/' + fbKey + '.json');
      await fetch(itemUrl, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ st: st })
      });
      setSyncUI(true, 'Онлайн • Синхронизировано');
    } catch (e) {
      setSyncUI(false, 'Ошибка обновления статуса');
    }
  }

  async function delMatch(fbKey) {
    if (!confirm('Удалить этот матч из общего расписания?')) return;
    db = db.filter(e => e.fbKey !== fbKey);
    render();
    setSyncUI(true, 'Удаление...');
    try {
      const itemUrl = DB_URL.replace('/matches.json', '/matches/' + fbKey + '.json');
      await fetch(itemUrl, { method: 'DELETE' });
      setSyncUI(true, 'Онлайн • Синхронизировано');
    } catch (e) {
      setSyncUI(false, 'Ошибка удаления');
    }
  }

  function render() {
    const y = cur.getFullYear(), m = cur.getMonth();
    const mPrefix = y + '-' + pad(m + 1);
    document.getElementById('mLbl').textContent = new Date(y, m, 1).toLocaleString('ru-RU', { month: 'long', year: 'numeric' });

    const filtered = db.filter(e => rosFilter === 'ALL' || e.ros === rosFilter);

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w => {
      const el = document.createElement('div');
      el.className = 'wday';
      el.textContent = w;
      grid.appendChild(el);
    });

    const start = (new Date(y, m, 1).getDay() + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate();
    const prev = new Date(y, m, 0).getDate();

    Array.from({ length: start }).forEach((_, idx) => {
      const el = document.createElement('div');
      el.className = 'cell dim';
      el.innerHTML = '<div class="num">' + (prev - start + 1 + idx) + '</div>';
      grid.appendChild(el);
    });

    Array.from({ length: days }).forEach((_, idx) => {
      const d = idx + 1;
      const ds = mPrefix + '-' + pad(d);
      const dayEvs = filtered.filter(e => e.dt && e.dt.startsWith(ds)).sort((a, b) => a.dt.localeCompare(b.dt));

      const el = document.createElement('div');
      el.className = 'cell' + (ds === today ? ' today' : '') + (selDate === ds ? ' sel' : '');
      el.onclick = () => pickDay(ds);

      const head = document.createElement('div');
      head.className = 'c-head';
      head.innerHTML = '<div class="num">' + d + '</div>';
      el.appendChild(head);

      dayEvs.forEach(e => {
        const p = document.createElement('div');
        p.className = 'pill ' + e.st;
        const ico = document.createElement('img');
        ico.src = e.ros === 'MAIN' ? LOGO_MAIN : LOGO_ACAD;
        const sp = document.createElement('span');
        sp.textContent = e.dt.slice(11, 16) + ' ' + e.title;
        p.append(ico, sp);
        el.appendChild(p);
      });
      grid.appendChild(el);
    });

    const tail = (7 - (start + days) % 7) % 7;
    Array.from({ length: tail }).forEach((_, idx) => {
      const el = document.createElement('div');
      el.className = 'cell dim';
      el.innerHTML = '<div class="num">' + (idx + 1) + '</div>';
      grid.appendChild(el);
    });

    const listEvs = filtered
      .filter(e => e.dt && (selDate ? e.dt.startsWith(selDate) : e.dt.startsWith(mPrefix)))
      .sort((a, b) => a.dt.localeCompare(b.dt));

    document.getElementById('listTitle').textContent = selDate
      ? 'Матчи на ' + new Date(selDate).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })
      : 'Матчи выбранного месяца';
    document.getElementById('resetBtn').style.display = selDate ? 'inline-block' : 'none';

    const list = document.getElementById('list');
    list.innerHTML = '';
    if (!listEvs.length) {
      list.innerHTML = '<div style="color:var(--mut);text-align:center;padding:24px;background:var(--card);border-radius:10px;border:1px solid var(--brd)">Нет запланированных матчей на этот период</div>';
      return;
    }

    listEvs.forEach(e => {
      const fDate = new Date(e.dt).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      const card = document.createElement('div');
      card.className = 'm-card ' + e.st;

      const left = document.createElement('div');
      left.className = 'm-left';

      const logo = document.createElement('img');
      logo.className = 'm-logo';
      logo.src = e.ros === 'MAIN' ? LOGO_MAIN : LOGO_ACAD;

      const info = document.createElement('div');
      const badge = document.createElement('span');
      badge.className = 'badge ' + (e.ros === 'MAIN' ? 'b-main' : 'b-acad');
      badge.textContent = e.ros === 'MAIN' ? 'EE • Основной' : 'EE Academy';

      const title = document.createElement('div');
      title.className = 'm-title';
      title.textContent = e.title;

      const meta = document.createElement('div');
      meta.className = 'm-meta';
      meta.innerHTML = '<span>📅 ' + fDate + '</span>';
      if (e.link) {
        const a = document.createElement('a');
        a.href = e.link;
        a.target = '_blank';
        a.textContent = '🔗 Ссылка на матч';
        meta.appendChild(a);
      }

      info.append(badge, title, meta);
      left.append(logo, info);

      const ctrls = document.createElement('div');
      ctrls.className = 'ctrls';
      [['yes', 's-y', '✅ Смогу'], ['pend', 's-p', '⏳ Думаю'], ['no', 's-n', '❌ Не смогу']].forEach(cfg => {
        const b = document.createElement('button');
        b.className = 'st-btn ' + cfg[1] + (e.st === cfg[0] ? ' act' : '');
        b.textContent = cfg[2];
        b.onclick = () => setSt(e.fbKey, cfg[0]);
        ctrls.appendChild(b);
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '✕';
      delBtn.title = 'Удалить матч';
      delBtn.onclick = () => delMatch(e.fbKey);
      ctrls.appendChild(delBtn);

      card.append(left, ctrls);
      list.appendChild(card);
    });
  }

  function pickDay(ds) {
    selDate = (selDate === ds) ? null : ds;
    document.getElementById('fDt').value = ds + 'T19:00';
    render();
  }
  function move(n) {
    cur = new Date(cur.getFullYear(), cur.getMonth() + n, 1);
    selDate = null;
    render();
  }
  function setRos(r, btn) {
    rosFilter = r;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('act'));
    btn.classList.add('act');
    render();
  }

  loadFromCloud();
  setInterval(loadFromCloud, 15000);
</script>
</body>
</html>

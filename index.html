<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EE Broadcast Hub — Календарь Кастера</title>
<style>
  :root {
    --bg: #0c0d10; --card: #15171e; --card2: #1c1f29; --brd: #2a2e3d;
    --txt: #f8fafc; --mut: #94a3b8; --red: #dc2626; --red-h: #ef4444;
    --yes: #10b981; --no: #ef4444; --pend: #f59e0b; --casted: #38bdf8;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--txt); margin: 0; padding: 18px; }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  
  /* Header */
  .top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; background: var(--card); padding: 14px 20px; border-radius: 12px; border: 1px solid var(--brd); }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 44px; height: 44px; border-radius: 8px; background: #0a0a0c; border: 1px solid var(--brd); }
  .brand h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.5px; }
  .brand small { color: var(--mut); font-size: 0.8rem; display: flex; align-items: center; gap: 8px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yes); display: inline-block; }
  
  .tabs { background: var(--bg); padding: 5px; border-radius: 9px; display: flex; gap: 6px; border: 1px solid var(--brd); }
  .tab { background: transparent; border: none; color: var(--mut); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 7px; font-size: 0.88rem; }
  .tab img { width: 20px; height: 20px; border-radius: 4px; background: #0a0a0c; }
  .tab.act { background: var(--red); color: #fff; }

  /* Stats Panel */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .stat-card { background: var(--card); border: 1px solid var(--brd); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .stat-lbl { font-size: 0.78rem; color: var(--mut); text-transform: uppercase; font-weight: 700; letter-spacing: 0.4px; }
  .stat-val { font-size: 1.55rem; font-weight: 800; color: var(--txt); }
  .stat-sub { font-size: 0.78rem; color: var(--mut); }

  /* Form */
  .form-box { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--brd); display: flex; flex-direction: column; gap: 12px; }
  .mode-row { display: flex; gap: 8px; }
  .m-btn { background: var(--bg); border: 1px solid var(--brd); color: var(--mut); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
  .m-btn.act { border-color: var(--red); color: #fff; background: rgba(220,38,38,0.15); }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 10px; }
  input, select, button { padding: 9px 12px; border-radius: 7px; border: 1px solid var(--brd); background: var(--bg); color: #fff; font-size: 0.88rem; }
  .btn-add { background: var(--red); border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.4px; }
  .btn-add:hover { background: var(--red-h); }

  /* Calendar Grid */
  .cal-box { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--brd); }
  .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .m-lbl { font-size: 1.2rem; font-weight: 700; text-transform: capitalize; }
  .cal-nav button { cursor: pointer; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--brd); border: 1px solid var(--brd); border-radius: 8px; overflow: hidden; }
  .wday { background: var(--card2); padding: 8px; text-align: center; font-size: 0.78rem; color: var(--mut); font-weight: 700; }
  .cell { background: var(--bg); min-height: 102px; padding: 6px; cursor: pointer; transition: 0.15s; }
  .cell:hover { background: #141720; }
  .cell.dim { opacity: 0.3; cursor: default; }
  .cell.sel { outline: 2px solid var(--red); outline-offset: -2px; }
  .num { width: 23px; height: 23px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }
  .today .num { background: var(--red); color: #fff; }
  .pill { font-size: 0.7rem; padding: 3px 5px; border-radius: 4px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--pend); background: var(--card2); display: flex; align-items: center; gap: 4px; }
  .pill img { width: 13px; height: 13px; border-radius: 2px; flex-shrink: 0; }
  .pill.yes { border-left-color: var(--yes); }
  .pill.no { border-left-color: var(--no); }
  .pill.casted { text-decoration: line-through; opacity: 0.65; }

  /* Match Cards */
  .list-head { display: flex; justify-content: space-between; align-items: center; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .m-card { background: var(--card); padding: 14px 18px; border-radius: 10px; border: 1px solid var(--brd); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; border-left: 5px solid var(--pend); }
  .m-card.yes { border-left-color: var(--yes); }
  .m-card.no { border-left-color: var(--no); }
  .card-left { display: flex; align-items: flex-start; gap: 14px; }
  .card-logo { width: 46px; height: 46px; border-radius: 8px; background: #0a0a0c; border: 1px solid var(--brd); flex-shrink: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 5px; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
  .b-ros { background: rgba(220,38,38,0.2); color: #fca5a5; }
  .b-stage { background: rgba(148,163,184,0.18); color: #e2e8f0; }
  .b-stage.final { background: rgba(245,158,11,0.22); color: #fcd34d; }
  .b-fmt { background: rgba(56,189,248,0.18); color: #7dd3fc; }
  .b-diff-easy { background: rgba(16,185,129,0.2); color: #6ee7b7; cursor: pointer; }
  .b-diff-hard { background: rgba(239,68,68,0.22); color: #fca5a5; cursor: pointer; }
  .b-casted { background: rgba(56,189,248,0.25); color: #38bdf8; }
  .m-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
  .m-meta { color: var(--mut); font-size: 0.83rem; display: flex; flex-wrap: wrap; gap: 14px; }
  .m-meta a { color: #f87171; text-decoration: none; font-weight: 600; }
  
  .ctrls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .st-btn { border: none; padding: 7px 11px; border-radius: 6px; cursor: pointer; font-weight: 600; opacity: 0.4; font-size: 0.82rem; }
  .st-btn.act { opacity: 1; }
  .s-y { background: var(--yes); color: #052e16; }
  .s-p { background: var(--pend); color: #451a03; }
  .s-n { background: var(--no); color: #fff; }
  .cast-btn { border: 1px solid var(--brd); background: var(--bg); color: var(--mut); padding: 7px 11px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.82rem; }
  .cast-btn.done { background: rgba(56,189,248,0.2); border-color: var(--casted); color: var(--casted); }
  .ic-btn { background: var(--bg); border: 1px solid var(--brd); color: var(--mut); cursor: pointer; padding: 7px 9px; border-radius: 6px; }
  .ic-btn:hover { color: #fff; border-color: var(--mut); }

  /* Modal */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal.open { display: flex; }
  .m-box { background: var(--card); border: 1px solid var(--brd); border-radius: 12px; padding: 20px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 11px; }
  .m-box h3 { margin: 0 0 4px 0; }
</style>
</head>

      <option value="BO1">Формат: BO1</option>
      <option value="BO5">Формат: BO5</option>
    </select>
    <select id="eDiff">
      <option value="easy">BO3: 🟢 Лёгкий</option>
      <option value="hard">BO3: 🔴 Сложный</option>
    </select>
    <input type="text" id="eTitle" placeholder="Турнир / Соперник">
    <input type="url" id="eLink" placeholder="Ссылка">
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button onclick="closeEdit()" style="cursor:pointer">Отмена</button>
      <button class="btn-add" onclick="saveEdit()">Сохранить</button>
    </div>
  </div>
</div>

<script>
  const DB_URL = "https://ee-caster-calendar-default-rtdb.europe-west1.firebasedatabase.app/events.json";
  const LOGO_MAIN = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAAD1ElEQVR4nO2dQU7lMBBEzWhWMHMBxG723P8c7NgjLoD+emZlEaIwPz9xu6u66i2RQHbXSzt2UHJ3f//rbzOy/MgegMnFAohjAcSxAOJYAHEsgDgWQBwLII4FEMcCiGMBxLEA4lgAcSyAOBZAnJ/ZA5jFy9Pjzb/z/PYeMBIs7ir+Q8iRsPdSTYoSAkQGfg12IagFyAx+DasIdAIghf4dTDLQCMAQ/BoGEeAFYAx+DbII0OcAFcJvDXsekB0AuWBnQesGcB2gcvit4c0PSgC04kSBNE+IJQCpILPJXhLSBZgV/pFCI49tFKkCsJ3Zs413D2kCRBRzZhHZx99JEWB08TJbKPtcpgswsmDZN1BLWOc1VYBRRUIKfg3bHKHOAfaAHH5r+ONbM60DnL0y2ArbGsecp3QAhkJEcHbcM84hwgVQDb9zdPx/Xl9ba/ESQP9XMHv4nee39y9B9nARCBXgjL2s4V8uH8P/5svTY1g9wgSoGH5EuHuJkgBuCcgKPzPcTNKfBs7mcvloDw+/N3+OxtY4RwPXAc6AGCI6NAI43BggBHC4eYQL4HC3mbG+72GoAJH7VTYiAx5Z5/BdAGIHOLsLQLl6R0D3ONiMxQKIA7ELGEml9jwDOgEc8FigBFAO97sj6migBKgG4g5ojQU4AEOwe/EuQBwLIE55ASq16wgo7wEc6jigBHCw8ym/BJj/A9UBKoJ+uGUBDoAe6i14CRDHAohjAcShvQeotA5nAiWAQ/1k1uNhKAFUQDrwsgABIAV8DQtwAKaAr+FdgDhyAlS6ekdQaglwuLdDJYADHg+UAA54PlACKIFy6GUBAkAJdw8W4EaYwt2DBVhQLdw9DD0HYP76F1P4I+tc7g0hTEEiQLUEONzxwAjgcHOYIoDDxUXuXcHmK3Cvi1d4zyBSbeAeBzNvJfeANr8wAc7YilakUSB+RCO0A1iCTxDDbw1wCVhSRQLkeYQLwPDtvEjQP5s3pQOoSoAefmuEH49m2CYyzRP6HmAL9G6APr41008CRxYIqRuwzivlKHj0VZIpAvtc0p4FRLTKmcVjH38n9WFQ5HoZUUy28e4h/WngrJumIwVGHtso0gVoje/OeSTZN7IQAnSURMgOvgN1DoBSlGiQ5gklQGtYxYkAbX5QS8CaSksCWvAduA6wBLVot4I8D+gOsISxGyAH36ERoMMgAkPwHToBliDJwBT6EmoBOpkisAbfKSHAmopn9lGUFGCLI1JUC3sLGQHMNtDnACYeCyCOBRDHAohjAcSxAOJYAHEsgDgWQBwLII4FEMcCiGMBxLEA4vwDoKxgEvSWJWwAAAAASUVORK5CYII=";
  const LOGO_ACAD = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAAD7UlEQVR4nO2du07kQBBFm9VGsPsDiIyAbP7/O8gmIBvND6CJdyMLY3mMH1Vdt+reEyIE3X2Pqx+27IfHxz//mqDlV3QDRCwSgBwJQI4EIEcCkCMByJEA5EgAciQAORKAHAlADr0A7y/P0U0I5YHxZtBS6KfLtWNL4qESYOvVziBDeQEsS3xFIcoK4D23V5GhlABRC7rMMqQXAG0Vn02GtAKgBT9HBhlSCZAh9CUQhYAXIHvo90CRAVaAqsHPESnD77D/PINC7w+EAAo+jrApgCn0KUgSdBWAOfQpKBJ0EUDB3ydaBDcBFPp6IiVQBQAhSgL6J4K2crpcXcKKukhUAVawFLh133pXAgmwwJYwsj54IgEmHB18q772kgDiJDAay8E+Xa6phE9TAYaQMpXao23tUQVSCGC5COu9yEKXwF2AngOA+rz/njF4PZ/bx9tba8237dBrgK0dH//++8tz+DHrwHRd8Ho+B7bmO64V4MjVjxLeVm63T7O/NVSA1vzGw60CVAzfMtyteFU0uCkgKvzIcCOBfSbQi9vtsz09/Z39ORpz7bQGrgIcATFEdNIIoHB9gBBA4cbhLoDCnafH/L4GUwGQDl+i8QzYcpzddwGIFeDoLgDl6rVAj4SRIwHIgdgFWFKpPPcgnQAK2BYoAZjDvXdE7Q2UANVA3AFNkQA7yBDsWrQLIEcCkFNegErl2oOUawCFageUAAq2P+WnALEMVAWoCPrhlgTYAXqoW9AUQI4EIEcCkJN2DVBpHo4ESgCF+kWv28NQArCAdOAlARxACvgnJMAOMgX8E9oFkEMnQKWr14JSU4DC3U4qARSwPVACKOD+QAnABMqhlwRwACXcNUiAjWQKdw0SYES1cNdgeg6Q6TXpUzKFbznO5d4QkilIBFJNAQrXHhgBFG4MXQRQuLjQvStYfAfudfEM7xlEGhu428GZt5JrQOufmwBHbEUbJCsQP6LhWgEkwReI4bcGOAWMqSIBcj/cBUD5FGsU6N8N7FIBWCVAD7+1zucAlp+QRSZTP6HXAHOgVwP09k3pfhKY6ePPW8jar5CjYOurJNt3gZfo3ZewewEepbLn4GVv/0DozSDP+dJjMLO1dw3hdwN7LZr2DDBy26wIF6C1fCtnS6IXshACDDCJEB38ANQ5AMqgeIPUTygBWsMaHA/Q+gc1BUypNCWgBT8AVwHGoA7aVpD7AV0BxmSsBsjBD6QRYCCDCBmCH0gnwBgkGTKFPia1AAORImQNfqCEAFMqntl7UVKAOfZIUS3sOWgEEPNAnwMIfyQAORKAHAlAjgQgRwKQIwHIkQDkSAByJAA5EoAcCUCOBCBHApDzH8OvfgQX4q0ZAAAAAElFTkSuQmCC";

  const pad = n => String(n).padStart(2, '0');
  const dStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = dStr(new Date());

  let cur = new Date(), rosFilter = 'ALL', selDate = null, addMode = 'match';
  let db = [];

  function setSync(ok, msg) {
    document.getElementById('syncDot').style.background = ok ? '#10b981' : '#f59e0b';
    document.getElementById('syncTxt').textContent = msg;
  }

  async function loadDB() {
    try {
      const res = await fetch(DB_URL);
      const data = await res.json();
      if (Array.isArray(data)) db = data.filter(Boolean);
      else if (data && typeof data === 'object') db = Object.values(data);
      else db = [];
      setSync(true, 'Синхронизировано с Firebase');
      render();
    } catch (e) {
      setSync(false, 'Ошибка сети (проверьте интернет)');
    }
  }

  async function saveDB() {
    setSync(false, 'Сохранение...');
    render();
    try {
      await fetch(DB_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(db)
      });
      setSync(true, 'Синхронизировано с Firebase');
    } catch (e) {
      setSync(false, 'Ошибка сохранения в облако');
    }
  }

  function setMode(m) {
    addMode = m;
    document.getElementById('modeMatchBtn').classList.toggle('act', m === 'match');
    document.getElementById('modeRangeBtn').classList.toggle('act', m === 'range');
    const dt = document.getElementById('fDt');
    const end = document.getElementById('fEnd');
    if (m === 'range') {
      dt.type = 'date';
      end.style.display = 'block';
    } else {
      dt.type = 'datetime-local';
      end.style.display = 'none';
    }
  }

  function toggleDiff(fmtId, diffId) {
    const v = document.getElementById(fmtId).value;
    document.getElementById(diffId).style.display = (v === 'BO3') ? 'block' : 'none';
  }

  function eventCoversDate(e, ds) {
    if (e.mode === 'range') {
      const s = (e.dt || '').slice(0, 10);
      const end = (e.end || s).slice(0, 10);
      return ds >= s && ds <= end;
    }
    return (e.dt || '').startsWith(ds);
  }

  function eventInMonth(e, mPrefix) {
    if (e.mode === 'range') {
      const s = (e.dt || '').slice(0, 7);
      const end = (e.end || s).slice(0, 7);
      return mPrefix >= s && mPrefix <= end;
    }
    return (e.dt || '').startsWith(mPrefix);
  }

  function updateStats(monthEvs) {
    const casted = monthEvs.filter(e => e.casted);
    const planned = monthEvs.filter(e => !e.casted && e.st === 'yes');
    const bo1 = casted.filter(e => e.fmt === 'BO1').length;
    const bo3Easy = casted.filter(e => (e.fmt === 'BO3' || !e.fmt) && (e.diff || 'easy') === 'easy').length;
    const bo3Hard = casted.filter(e => (e.fmt === 'BO3' || !e.fmt) && e.diff === 'hard').length;
    const bo5 = casted.filter(e => e.fmt === 'BO5').length;

    document.getElementById('stTotal').textContent = casted.length;
    document.getElementById('stPlan').textContent = 'Запланировано (Смогу): ' + planned.length;
    document.getElementById('stBo1').textContent = bo1;
    document.getElementById('stBo3Easy').textContent = bo3Easy;
    document.getElementById('stBo3Hard').textContent = bo3Hard + (bo5 ? ' (+' + bo5 + ' BO5)' : '');
  }

  function render() {
    const y = cur.getFullYear(), m = cur.getMonth();
    const mPrefix = y + '-' + pad(m + 1);
    document.getElementById('mLbl').textContent = new Date(y, m, 1).toLocaleString('ru-RU', { month: 'long', year: 'numeric' });

    const filtered = db.filter(e => rosFilter === 'ALL' || e.ros === rosFilter);
    const monthEvs = filtered.filter(e => eventInMonth(e, mPrefix));
    updateStats(monthEvs);

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w => {
      const el = document.createElement('div');
      el.className = 'wday';
      el.textContent = w;
      grid.appendChild(el);
    });

    const start = (new Date(y, m, 1).getDay() + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate();
    const prev = new Date(y, m, 0).getDate();

    Array.from({ length: start }).forEach((_, idx) => {
      const el = document.createElement('div');
      el.className = 'cell dim';
      el.innerHTML = '<div class="num">' + (prev - start + 1 + idx) + '</div>';
      grid.appendChild(el);
    });

    Array.from({ length: days }).forEach((_, idx) => {
      const d = idx + 1;
      const ds = mPrefix + '-' + pad(d);
      const dayEvs = filtered.filter(e => eventCoversDate(e, ds)).sort((a, b) => (a.dt || '').localeCompare(b.dt || ''));

      const el = document.createElement('div');
      el.className = 'cell' + (ds === today ? ' today' : '') + (selDate === ds ? ' sel' : '');
      el.onclick = () => pickDay(ds);

      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = d;
      el.appendChild(num);

      dayEvs.forEach(e => {
        const p = document.createElement('div');
        p.className = 'pill ' + (e.st || 'pend') + (e.casted ? ' casted' : '');
        const img = document.createElement('img');
        img.src = e.ros === 'ACAD' ? LOGO_ACAD : LOGO_MAIN;
        const txt = document.createElement('span');
        const prefix = e.mode === 'range' ? '🏆 ' : (e.dt && e.dt.length >= 16 ? e.dt.slice(11, 16) + ' ' : '');
        txt.textContent = prefix + e.title;
        p.append(img, txt);
        el.appendChild(p);
      });
      grid.appendChild(el);
    });

    const tail = (7 - (start + days) % 7) % 7;
    Array.from({ length: tail }).forEach((_, idx) => {
      const el = document.createElement('div');
      el.className = 'cell dim';
      el.innerHTML = '<div class="num">' + (idx + 1) + '</div>';
      grid.appendChild(el);
    });

    const listEvs = (selDate ? filtered.filter(e => eventCoversDate(e, selDate)) : monthEvs)
      .sort((a, b) => (a.dt || '').localeCompare(b.dt || ''));

    document.getElementById('listTitle').textContent = selDate
      ? 'События на ' + new Date(selDate).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })
      : 'События выбранного месяца';
    document.getElementById('resetBtn').style.display = selDate ? 'inline-block' : 'none';

    const list = document.getElementById('list');
    list.innerHTML = '';
    if (!listEvs.length) {
      list.innerHTML = '<div style="color:var(--mut);text-align:center;padding:22px;background:var(--card);border-radius:10px;border:1px solid var(--brd)">Нет запланированных событий</div>';
      return;
    }

    listEvs.forEach(e => {
      const card = document.createElement('div');
      card.className = 'm-card ' + (e.st || 'pend');

      const left = document.createElement('div');
      left.className = 'card-left';

      const logo = document.createElement('img');
      logo.className = 'card-logo';
      logo.src = e.ros === 'ACAD' ? LOGO_ACAD : LOGO_MAIN;

      const info = document.createElement('div');
      const badges = document.createElement('div');
      badges.className = 'badges';

      const bRos = document.createElement('span');
      bRos.className = 'badge b-ros';
      bRos.textContent = e.ros === 'ACAD' ? 'EE Academy' : 'EE • Основной';
      badges.appendChild(bRos);

      if (e.stage) {
        const bStg = document.createElement('span');
        bStg.className = 'badge b-stage' + (e.stage === 'Финал' ? ' final' : '');
        bStg.textContent = e.stage;
        badges.appendChild(bStg);
      }

      const fmt = e.fmt || 'BO3';
      const bFmt = document.createElement('span');
      bFmt.className = 'badge b-fmt';
      bFmt.textContent = fmt;
      badges.appendChild(bFmt);

      if (fmt === 'BO3') {
        const isHard = e.diff === 'hard';
        const bDiff = document.createElement('span');
        bDiff.className = 'badge ' + (isHard ? 'b-diff-hard' : 'b-diff-easy');
        bDiff.textContent = isHard ? '🔴 Сложный BO3' : '🟢 Лёгкий BO3';
        bDiff.title = 'Нажмите, чтобы переключить сложность BO3';
        bDiff.onclick = () => toggleCardDiff(e.id);
        badges.appendChild(bDiff);
      }

      if (e.casted) {
        const bCast = document.createElement('span');
        bCast.className = 'badge b-casted';
        bCast.textContent = '🎙️ Откащено';
        badges.appendChild(bCast);
      }

      const title = document.createElement('div');
      title.className = 'm-title';
      title.textContent = e.title;

      const meta = document.createElement('div');
      meta.className = 'm-meta';
      let dateLabel = '';
      if (e.mode === 'range') {
        const d1 = new Date(e.dt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        const d2 = new Date(e.end || e.dt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        dateLabel = '🏆 Период: ' + d1 + ' — ' + d2;
      } else {
        dateLabel = '📅 ' + new Date(e.dt).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      }
      meta.innerHTML = '<span>' + dateLabel + '</span>';

      if (e.link) {
        const a = document.createElement('a');
        a.href = e.link;
        a.target = '_blank';
        a.textContent = '🔗 Ссылка на турнир / матч';
        meta.appendChild(a);
      }

      info.append(badges, title, meta);
      left.append(logo, info);

      const ctrls = document.createElement('div');
      ctrls.className = 'ctrls';

      [['yes', 's-y', '✅ Смогу'], ['pend', 's-p', '⏳ Думаю'], ['no', 's-n', '❌ Не смогу']].forEach(cfg => {
        const b = document.createElement('button');
        b.className = 'st-btn ' + cfg[1] + ((e.st || 'pend') === cfg[0] ? ' act' : '');
        b.textContent = cfg[2];
        b.onclick = () => setSt(e.id, cfg[0]);
        ctrls.appendChild(b);
      });

      const cBtn = document.createElement('button');
      cBtn.className = 'cast-btn' + (e.casted ? ' done' : '');
      cBtn.textContent = e.casted ? '🎙️ Откащено' : '🎙️ Не откащено';
      cBtn.onclick = () => toggleCasted(e.id);
      ctrls.appendChild(cBtn);

      const editBtn = document.createElement('button');
      editBtn.className = 'ic-btn';
      editBtn.textContent = '✏️';
      editBtn.title = 'Редактировать';
      editBtn.onclick = () => openEdit(e.id);
      ctrls.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'ic-btn';
      delBtn.textContent = '✕';
      delBtn.title = 'Удалить';
      delBtn.onclick = () => delEvent(e.id);
      ctrls.appendChild(delBtn);

      card.append(left, ctrls);
      list.appendChild(card);
    });
  }

  function pickDay(ds) {
    selDate = (selDate === ds) ? null : ds;
    document.getElementById('fDt').value = addMode === 'range' ? ds : ds + 'T19:00';
    if (addMode === 'range') document.getElementById('fEnd').value = ds;
    render();
  }

  function move(n) { cur = new Date(cur.getFullYear(), cur.getMonth() + n, 1); selDate = null; render(); }
  function setRos(r, btn) { rosFilter = r; document.querySelectorAll('.tab').forEach(b => b.classList.remove('act')); btn.classList.add('act'); render(); }

  function addEvent() {
    const dt = document.getElementById('fDt').value;
    const end = document.getElementById('fEnd').value;
    const title = document.getElementById('fTitle').value.trim();
    if (!dt || !title) return alert('Укажите дату и название турнира/матча');
    if (addMode === 'range' && !end) return alert('Укажите дату окончания турнира');

    const fmt = document.getElementById('fFmt').value;
    db.push({
      id: Date.now(),
      mode: addMode,
      ros: document.getElementById('fRos').value,
      dt,
      end: addMode === 'range' ? end : '',
      stage: document.getElementById('fStage').value,
      fmt,
      diff: fmt === 'BO3' ? document.getElementById('fDiff').value : 'easy',
      title,
      link: document.getElementById('fLink').value.trim(),
      st: 'pend',
      casted: false
    });
    document.getElementById('fTitle').value = '';
    document.getElementById('fLink').value = '';
    saveDB();
  }

  function setSt(id, st) { const x = db.find(e => e.id === id); if (x) { x.st = st; saveDB(); } }
  function toggleCasted(id) { const x = db.find(e => e.id === id); if (x) { x.casted = !x.casted; saveDB(); } }
  function toggleCardDiff(id) { const x = db.find(e => e.id === id); if (x) { x.diff = (x.diff === 'hard') ? 'easy' : 'hard'; saveDB(); } }
  function delEvent(id) { if (confirm('Удалить событие?')) { db = db.filter(e => e.id !== id); saveDB(); } }

  function toggleEditMode() {
    const m = document.getElementById('eMode').value;
    const dt = document.getElementById('eDt');
    const end = document.getElementById('eEnd');
    if (m === 'range') {
      dt.type = 'date';
      if (dt.value.length > 10) dt.value = dt.value.slice(0, 10);
      end.style.display = 'block';
      if (!end.value) end.value = dt.value;
    } else {
      dt.type = 'datetime-local';
      if (dt.value.length === 10) dt.value = dt.value + 'T19:00';
      end.style.display = 'none';
    }
  }

  function openEdit(id) {
    const e = db.find(x => x.id === id);
    if (!e) return;
    document.getElementById('eId').value = e.id;
    document.getElementById('eMode').value = e.mode || 'match';
    document.getElementById('eRos').value = e.ros || 'MAIN';
    toggleEditMode();
    document.getElementById('eDt').value = e.dt || '';
    document.getElementById('eEnd').value = e.end || '';
    document.getElementById('eStage').value = e.stage || 'Групповая стадия';
    document.getElementById('eFmt').value = e.fmt || 'BO3';
    document.getElementById('eDiff').value = e.diff || 'easy';
    toggleDiff('eFmt', 'eDiff');
    document.getElementById('eTitle').value = e.title || '';
    document.getElementById('eLink').value = e.link || '';
    document.getElementById('editModal').classList.add('open');
  }

  function closeEdit() { document.getElementById('editModal').classList.remove('open'); }

  function saveEdit() {
    const id = Number(document.getElementById('eId').value);
    const e = db.find(x => x.id === id);
    if (!e) return;
    const title = document.getElementById('eTitle').value.trim();
    const dt = document.getElementById('eDt').value;
    if (!title || !dt) return alert('Заполните дату и название');

    e.mode = document.getElementById('eMode').value;
    e.ros = document.getElementById('eRos').value;
    e.dt = dt;
    e.end = e.mode === 'range' ? document.getElementById('eEnd').value : '';
    e.stage = document.getElementById('eStage').value;
    e.fmt = document.getElementById('eFmt').value;
    e.diff = e.fmt === 'BO3' ? document.getElementById('eDiff').value : 'easy';
    e.title = title;
    e.link = document.getElementById('eLink').value.trim();

    closeEdit();
    saveDB();
  }

  loadDB();
  setInterval(loadDB, 15000);
</script>
</body>
</html>
